name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists != 'true'
        run: ./scripts/test.sh
      - if: steps.version.outputs.exists != 'true'
        run: ./scripts/build.sh
      - if: steps.version.outputs.exists != 'true'
        name: Package
        run: |
          v="${{ steps.version.outputs.tag }}"
          ditto -c -k --keepParent build/Asteria.app "Asteria-${v#v}-macos-arm64.zip"
          shasum -a 256 Asteria-*.zip > SHA256SUMS.txt
      - if: steps.version.outputs.exists != 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.tag }}"
          gh release create "$v" --target "$GITHUB_SHA" --title "Asteria ${v#v}" --notes-file .github/release-notes.md Asteria-*.zip SHA256SUMS.txt
